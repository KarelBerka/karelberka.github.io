        /* Modern CV Page Custom Styles */
        .cv-hero {
            background: var(--gradient-hero);
            padding: 120px 0 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .cv-controls-card {
            background: var(--bg-surface);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-md);
        }

        .controls-title {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            width: 100%;
        }

        /* Full length buttons */
        .cv-format-btn {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-surface-alt);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cv-format-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .cv-format-btn.active {
            background: var(--gradient-accent);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .print-btn {
            grid-column: 1 / -1;
            background: transparent;
            border: 2px solid var(--color-primary);
            color: var(--color-primary);
            margin-top: 8px;
        }

        .print-btn:hover {
            background: var(--color-primary-light);
            color: var(--color-primary);
        }

        /* Render Container styles */
        .cv-paper {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 48px;
            box-shadow: var(--shadow-lg);
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }

        /* Europass Layout Specific Style overrides */
        .europass-layout {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .europass-row {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
            border-bottom: 1px solid var(--border-color);
            padding: 24px 0;
        }

        .europass-row:last-child {
            border-bottom: none;
        }

        .europass-left {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--color-primary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .europass-right h3 {
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .europass-header-logo {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        /* Generic CV layout details */
        .cv-section-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            margin: 32px 0 16px;
            border-bottom: 2px solid var(--color-primary);
            padding-bottom: 6px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cv-section-title:first-of-type {
            margin-top: 0;
        }

        .cv-timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .timeline-item {
            display: flex;
            gap: 24px;
        }

        .timeline-year {
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--color-primary);
            min-width: 90px;
            flex-shrink: 0;
        }

        .timeline-content {
            flex-grow: 1;
        }

        .cv-pub-list {
            list-style: decimal;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cv-pub-item {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Page sizes for printing */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                font-size: 11pt !important;
            }
            #site-header, footer, .cv-controls-card, canvas {
                display: none !important;
            }
            .cv-hero {
                padding: 0 !important;
                background: none !important;
                border: none !important;
            }
            .cv-paper {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                background: transparent !important;
            }
            .page-break {
                page-break-before: always;
            }
            /* Styling strictly for printing */
            .cv-pub-item {
                background: none !important;
            }
            a {
                text-decoration: underline !important;
                color: #000000 !important;
            }
        }

                    en: "Representative of the Czech Republic in the European bioinformatics infrastructure ELIXIR (since 2016)",
                    cs: "Zástupce ČR v evropské bioinformatické infrastruktuře ELIXIR (od roku 2016)"
                },
                {
                    en: "Member of the Royal Society of Chemistry (since 2013, AMRSC since 2015), Czech Chemical Society (since 2019), Biophysical Society (2016-2018), American Association of Pharmaceutical Scientists (2022-2023)",
                    cs: "Člen Royal Society of Chemistry – (od roku 2013, AMRSC od roku 2015), člen České společnosti chemické (od 2019), člen Biophysical Society (2016-2018), člen American Association of Pharmaceutical Scientists (2022-2023)"
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            const renderTarget = document.getElementById('cv-render-target');
            const formatButtons = document.querySelectorAll('.cv-format-btn[data-format]');
            let currentFormat = 'full';
            
            // Get lang helper
            function getLang() {
                return document.documentElement.lang || 'en';
            }

            // Helper to identify actual peer-reviewed publications / preprints
            function isPublication(p) {
                if (!p.authors || p.authors.trim() === '') return false;
                if (p.title && (p.title.includes('FAIRsharing') || p.title.includes('Ownership and Maintenance') || p.title.includes('Ownership of'))) return false;
                return true;
            }

            // Function to render non-publication items (registrations/entries)
            function getNonPublicationsHTML() {
                const lang = getLang();
                let nonPubs = publicationsData.filter(p => !isPublication(p));
                
                // Remove duplicates
                const seen = new Set();
                nonPubs = nonPubs.filter(p => {
                    const key = p.doi || p.id;
                    if (!key) return true;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });

                if (nonPubs.length === 0) return '';

                let html = `<ul style="padding-left: 20px; margin-bottom: 24px; line-height: 1.6;">`;
                nonPubs.forEach(p => {
                    const journalStr = p.journal ? `, <em>${p.journal}</em>` : '';
                    const urlStr = p.github ? ` (Link: <a href="${p.github}" target="_blank">${p.github}</a>)` : '';
                    html += `
                        <li style="margin-bottom: 8px; font-size: 0.95rem; color: var(--text-secondary);">
                            <strong>${p.title}</strong> (${p.year})${journalStr}${urlStr}
                        </li>
                    `;
                });
                html += `</ul>`;
                return html;
            }

            // Helper to format authors and metadata into ACS style
            function formatACS(p) {
                let authors = '';
                if (p.authors) {
                    const rawAuthors = p.authors.split(',').map(s => s.trim()).filter(Boolean);
                    const formattedAuthors = rawAuthors.map(author => {
                        if (author.includes('Consortium') || author.includes('Node') || author.includes('ELIXIR') || author.includes('Czech COVID-19')) return author;
                        const parts = author.split(/\s+/);
                        if (parts.length < 2) return author;
                        const lastName = parts[parts.length - 1];
                        const initials = parts.slice(0, -1).map(x => x.charAt(0) + '.').join('');
                        const nameString = `${lastName}, ${initials}`;
                        if (lastName === 'Berka' && (initials.startsWith('K') || initials.startsWith('P'))) {
                            return `<strong>${nameString}</strong>`;
                        }
                        return nameString;
                    });
                    authors = formattedAuthors.join('; ');
                }

                const title = p.title ? ` ${p.title}.` : '';
                const journalPart = p.journal ? ` <em>${p.journal}</em>` : ' <em>Preprint</em>';
                const yearPart = p.year ? ` <strong>${p.year}</strong>` : '';
                
                let volPart = '';
                if (p.volume) {
                    volPart = `, <em>${p.volume}</em>`;
                    if (p.issue) {
                        volPart += ` (${p.issue})`;
                    }
                }

                const pagesPart = p.pages ? `, ${p.pages}` : '';
                const doiPart = p.doi ? ` DOI: <a href="https://doi.org/${p.doi}" target="_blank">${p.doi}</a>.` : '.';

                return `${authors}.${title}${journalPart}${yearPart}${volPart}${pagesPart}.${doiPart}`;
            }

            // Function to render publications list dynamically as a numbered list
            function getPublicationsHTML(format) {
                const lang = getLang();
                let filtered = [...publicationsData];
                
                // Remove duplicates by DOI/ID, and exclude non-publications
                const seen = new Set();
                filtered = filtered.filter(p => {
                    if (!isPublication(p)) return false;
                    const key = p.doi || p.id;
                    if (!key) return true;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });

                if (format === 'onepage') {
                    // Up to 5 most recent
                    filtered.sort((a, b) => parseInt(b.year) - parseInt(a.year));
                    filtered = filtered.slice(0, 5);
                } else if (format === 'twopage') {
                    // Key/Selected ones from the last 10 years (2016-2026)
                    filtered = filtered.filter(p => {
                        const yr = parseInt(p.year);
                        return yr >= 2016 && yr <= 2026 && p.category && p.category.includes('Selected');
                    });
                    // Slice to fit 2-pager nicely
                    filtered = filtered.slice(0, 8);
                }

                if (filtered.length === 0) return '';

                let html = `<ol class="cv-pub-list" style="margin-left: 20px;">`;
                filtered.forEach(p => {
                    html += `
                        <li class="cv-pub-item" style="margin-bottom: 12px; line-height: 1.5; padding: 4px 0;">
                            ${formatACS(p)}
                        </li>
                    `;
                });
                html += `</ol>`;
                return html;
            }

            // The main render engine
            function renderCV() {
                const lang = getLang();
                let html = '';

                if (currentFormat === 'europass') {
                    // Standard European Europass structure
                    html = `
                        <div class="europass-layout">
                            <div class="europass-header-logo">
                                <img src="img/profile/Ja_2015_by_Jorge_Cham_PhD_Comics_AP-0074.jpg" alt="Photo" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--color-primary); background: #fff;">
                                <div>
                                    <h1 style="font-size: 2.2rem; margin: 0;">${cvData.personal.name}</h1>
                                    <p style="color: var(--color-primary); font-weight: 600; margin: 4px 0 0 0;">
                                        ${lang === 'cs' ? 'Curriculum Vitae' : 'Curriculum Vitae'}
                                    </p>
                                </div>
                            </div>

                            <div class="europass-row">
                                <div class="europass-left">${lang === 'cs' ? 'OSOBNÍ ÚDAJE' : 'PERSONAL INFORMATION'}</div>
                                <div class="europass-right">
                                    <p><strong>${lang === 'cs' ? 'Adresa:' : 'Address:'}</strong> ${cvData.personal.address[lang]}</p>
                                    <p><strong>${lang === 'cs' ? 'Email:' : 'Email:'}</strong> <a href="mailto:${cvData.personal.email}">${cvData.personal.email}</a></p>
                                    <p><strong>${lang === 'cs' ? 'Telefon:' : 'Phone:'}</strong> ${cvData.personal.phone}</p>
                                    <p><strong>ORCID:</strong> <a href="${cvData.personal.orcid}" target="_blank">${cvData.personal.orcidId}</a></p>
                                </div>
                            </div>

                            <div class="europass-row">
                                <div class="europass-left">${lang === 'cs' ? 'ZAMĚSTNÁNÍ' : 'WORK EXPERIENCE'}</div>
                                <div class="europass-right cv-timeline">
                                    ${cvData.employment.map(e => `
                                        <div class="timeline-item">
                                            <div class="timeline-year">${e.period[lang]}</div>
                                            <div class="timeline-content">${e.position[lang]}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="europass-row">
                                <div class="europass-left">${lang === 'cs' ? 'VZDĚLÁNÍ' : 'EDUCATION AND TRAINING'}</div>
                                <div class="europass-right cv-timeline">
                                    ${cvData.education.map(ed => `
                                        <div class="timeline-item">
                                            <div class="timeline-year">${ed.year}</div>
                                            <div class="timeline-content">${ed[lang]}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="europass-row">
                                <div class="europass-left">${lang === 'cs' ? 'VĚDECKÁ SPECIALIZACE' : 'RESEARCH FIELD'}</div>
                                <div class="europass-right">
                                    <p>${cvData.specialization[lang]}</p>
                                </div>
                            </div>

                            <div class="europass-row">
                                <div class="europass-left">${lang === 'cs' ? 'VYBRANÉ PUBLIKACE' : 'KEY PUBLICATIONS'}</div>
                                <div class="europass-right">
                                    ${getPublicationsHTML('twopage')}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // Full, 1-page, and 2-page Standard layouts
                    const isOnePage = currentFormat === 'onepage';
                    const isTwoPage = currentFormat === 'twopage';
                    
                    html = `
                        <div class="standard-layout">
                            <div style="text-align: center; margin-bottom: 32px; border-bottom: 2px solid var(--border-color); padding-bottom: 24px;">
                                <h1 style="font-size: 2.5rem; margin-bottom: 8px;">${cvData.personal.name}</h1>
                                <p style="margin-bottom: 8px;"><strong>${cvData.personal.address[lang]}</strong></p>
                                <p style="margin-bottom: 0;">
                                    Email: <a href="mailto:${cvData.personal.email}">${cvData.personal.email}</a> | 
                                    ${lang === 'cs' ? 'Tel:' : 'Phone:'} ${cvData.personal.phone} | 
                                    ORCID: <a href="${cvData.personal.orcid}" target="_blank">${cvData.personal.orcidId}</a>
                                </p>
                            </div>

                            <div class="cv-section-title">${lang === 'cs' ? 'Vzdělání' : 'Education'}</div>
                            <div class="cv-timeline">
                                ${(isOnePage ? cvData.education.slice(0, 3) : cvData.education).map(ed => `
                                    <div class="timeline-item">
                                        <div class="timeline-year">${ed.year}</div>
                                        <div class="timeline-content">${ed[lang]}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="cv-section-title">${lang === 'cs' ? 'Zaměstnání' : 'Employment History'}</div>
                            <div class="cv-timeline">
                                ${(isOnePage ? cvData.employment.slice(0, 3) : cvData.employment).map(e => `
                                    <div class="timeline-item">
                                        <div class="timeline-year">${e.period[lang]}</div>
                                        <div class="timeline-content">${e.position[lang]}</div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="cv-section-title">${lang === 'cs' ? 'Vědecká Specializace' : 'Scientific Specialization'}</div>
                            <p>${cvData.specialization[lang]}</p>

                            ${!isOnePage ? `
                                <div class="cv-section-title">${lang === 'cs' ? 'Zahraniční Stáže' : 'Foreign Internships'}</div>
                                <div class="cv-timeline">
                                    ${cvData.internships.map(i => `
                                        <div class="timeline-item">
                                            <div class="timeline-year">${i.year}</div>
                                            <div class="timeline-content">${i.details[lang]}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <div class="cv-section-title">${lang === 'cs' ? 'Vědecké Výstupy' : 'Scientific Outputs'}</div>
                            <p><strong>${cvData.summaryStats[lang]}</strong></p>

                            <div class="cv-section-title">
                                ${isOnePage ? (lang === 'cs' ? 'Nedávné Publikace (Výběr)' : 'Recent Publications (Selection)') : (lang === 'cs' ? 'Vybrané Publikace' : 'Key Publications')}
                            </div>
                            ${getPublicationsHTML(currentFormat)}

                            ${currentFormat === 'full' ? `
                                <div class="cv-section-title">${lang === 'cs' ? 'Databázové a Softwarové Záznamy' : 'Database & Software Registrations'}</div>
                                ${getNonPublicationsHTML()}
                            ` : ''}

                            ${!isOnePage ? `
                                <div class="page-break"></div>
                                <div class="cv-section-title">${lang === 'cs' ? 'Vybrané Granty a Projekty' : 'Selected Grants & Projects'}</div>
                                <div class="cv-timeline">
                                    ${cvData.grants.map(g => `
                                        <div class="timeline-item">
                                            <div class="timeline-year">${g.period}</div>
                                            <div class="timeline-content">${g.title[lang]}</div>
                                        </div>
                                    `).join('')}
                                </div>

                                <div class="cv-section-title">${lang === 'cs' ? 'Členství v Učených Společnostech' : 'Memberships & Professional Services'}</div>
                                <ul style="padding-left: 20px; margin-bottom: 24px;">
                                    ${cvData.memberships.map(m => `<li style="margin-bottom: 8px;">${m[lang]}</li>`).join('')}
                                </ul>

                                <div class="cv-section-title">${lang === 'cs' ? 'Pedagogická Činnost' : 'Teaching Activities'}</div>
                                <ul style="padding-left: 20px; margin-bottom: 16px;">
                                    ${cvData.pedagogical.institutions.map(inst => `<li>${inst[lang]}</li>`).join('')}
                                </ul>
                                <p>${cvData.pedagogical.details[lang]}</p>
                            ` : ''}
                        </div>
                    `;
                }

                renderTarget.innerHTML = html;
            }

            // Set up format switches
            formatButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    formatButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFormat = btn.getAttribute('data-format');
                    renderCV();
                });
            });

            // Re-render when language is switched
            const langBtn = document.getElementById('lang-toggle');
            if (langBtn) {
                langBtn.addEventListener('click', () => {
                    setTimeout(renderCV, 50); // Small timeout to ensure DOM language attribute has updated
                });
            }

            // Initial render
            renderCV();
        });
    </script>
</body>
</html>
